[project]
name = "nynorsk-parallell"
version = "0.1.0"
description = "Reference-based evaluation of Bokmål to Nynorsk translation for Kunnskapsassistenten"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "sacrebleu>=2.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"
